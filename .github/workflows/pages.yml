name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --run
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        run: npm run test:e2e -- --project=chromium
      - name: Build Pages site
        run: BASE_PATH="${BASE_PATH:-/${GITHUB_REPOSITORY#*/}/}" npm run build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PAGES_REPOSITORY != '' && github.repository == vars.PAGES_REPOSITORY
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_REPOSITORY != '' && github.repository == vars.PAGES_REPOSITORY
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
